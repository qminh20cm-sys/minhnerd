<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFK Adventure HUD Studio</title><style>
:root{color-scheme:dark;--bg:#0b1218;--p:#172630;--p2:#203541;--line:#3b5360;--gold:#dfbd76;--muted:#9eb2ba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef4f2;font:14px system-ui}header{height:60px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:#111c24;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{font-weight:800;letter-spacing:.1em;color:#ffe2a3}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:400}button,select,input{font:inherit;color:inherit}button{background:#263d49;border:1px solid #536d79;border-radius:8px;padding:8px 11px;cursor:pointer}button:hover{border-color:var(--gold)}.primary{background:#725a30;border-color:var(--gold)}.app{max-width:1500px;margin:auto;padding:14px;display:grid;grid-template-columns:230px minmax(340px,1fr) 280px;gap:12px;min-height:calc(100vh - 60px)}.panel{background:var(--p);border:1px solid var(--line);border-radius:11px;overflow:hidden}.panel h2{font-size:11px;letter-spacing:.12em;color:var(--gold);padding:13px;margin:0;border-bottom:1px solid var(--line)}.palette{padding:9px;display:grid;gap:6px}.part{display:flex;align-items:center;gap:9px;text-align:left;background:var(--p2);width:100%}.ico{width:28px;height:28px;display:grid;place-items:center;background:#101b22;border-radius:7px;font-size:17px}.part small{display:block;color:var(--muted);font-size:10px}.center{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}.toolbar{width:100%;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px;background:var(--p);border:1px solid var(--line);border-radius:9px}.toolbar button{font-size:11px}.stage{width:100%;flex:1;min-height:500px;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(ellipse,#263c46,#0a1116 72%);border:1px solid var(--line);border-radius:10px}.phone{width:min(100%,1000px);height:auto;max-height:76vh;aspect-ratio:16/9;position:relative;overflow:hidden;border:7px solid #263640;border-radius:18px;background:linear-gradient(#365a47 0 55%,#b49b6d 55% 70%,#365a47 70%);box-shadow:0 15px 45px #0009;touch-action:none}.phone:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#142c2733 2px,transparent 2px),linear-gradient(90deg,#142c2733 2px,transparent 2px);background-size:40px 40px;pointer-events:none}.sceneLabel{position:absolute;top:44%;width:100%;text-align:center;color:#f6e8bd;text-shadow:0 2px 4px #000;font-weight:bold;letter-spacing:.1em}.element{position:absolute;display:flex;align-items:center;justify-content:center;min-width:18px;min-height:18px;border:1px solid #91aab0;background:#263f4c;color:white;box-shadow:0 3px 9px #0008;user-select:none;cursor:grab;touch-action:none;white-space:nowrap}.element.selected{outline:2px solid #ffdf8a;outline-offset:3px;z-index:99!important}.element[data-key=hpStat],.element[data-key=mpStat],.element[data-key=xpStat]{flex-direction:column;font-size:9px}.bar{width:72%;height:5px;border-radius:5px;background:linear-gradient(90deg,#54cf7b 65%,#24343a 65%)}.element[data-key=joystick]{background:radial-gradient(circle,#6b9da5,#203843 70%);border:3px solid #90b7bc}.element[data-key=joystick]:after{content:"";width:42%;height:42%;border-radius:50%;background:#a5dce0;border:2px solid #d5f7f7}.right .fields{padding:13px;display:grid;gap:10px}.field label{display:flex;justify-content:space-between;font-size:11px;color:#cfdddf;margin-bottom:4px}.field output{color:var(--gold)}.field input[type=range]{width:100%;accent-color:var(--gold)}.field input[type=color]{width:100%;height:32px;background:#101b22;border:1px solid var(--line);border-radius:6px}.field select,.field input[type=text]{width:100%;padding:8px;background:#101b22;border:1px solid var(--line);border-radius:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:8px;align-items:center;font-size:12px}.actions{padding:0 13px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button{font-size:11px}.hint,.status{font-size:11px;color:var(--muted);line-height:1.5;padding:0 13px 12px}.status{color:#9bd9b2;padding-top:10px}@media(max-width:1000px){.app{grid-template-columns:190px minmax(300px,1fr)}.right{grid-column:1/-1}}@media(max-width:650px){.app{display:flex;flex-direction:column;padding:7px}.stage{min-height:0;padding:8px}.phone{width:100%;height:auto;max-height:46vh;aspect-ratio:16/9;border-width:5px;border-radius:12px}.left{order:2}.center{order:1}.right{order:3}}
</style></head><body>
<header><div class="brand">AFK ADVENTURE <small>HUD DESIGNER · PC STUDIO</small></div><div><button id="back">← Về game</button> <button class="primary" id="exportTop">Xuất HUD JSON</button></div></header>
<div class="app"><section class="panel left"><h2>THÀNH PHẦN HUD</h2><div class="palette" id="palette"></div><p class="hint">Chọn đối tượng hoặc kéo trực tiếp trên màn hình mô phỏng.</p></section>
<section class="center"><div class="toolbar"><div><button id="undo">↶ Hoàn tác</button> <button id="redo">↷ Làm lại</button> <button id="reset">↺ Mặc định</button></div><button id="save">Lưu trên PC</button></div><div class="stage"><div class="phone" id="phone"><div class="sceneLabel">KHU VỰC CHIẾN ĐẤU</div><div id="elements"></div></div></div><p class="hint">Mô phỏng màn hình ngang 16:9. Từng thành phần có thể kéo thả độc lập.</p></section>
<section class="panel right"><h2>THUỘC TÍNH ĐỐI TƯỢNG</h2><div class="fields">
<div class="field"><label>Đối tượng</label><select id="selected"></select></div><div class="field"><label>Icon / nội dung</label><input id="icon" type="text" maxlength="20"></div>
<div class="two"><div class="field"><label>X <output id="xO"></output></label><input id="x" type="range" min="0" max="100"></div><div class="field"><label>Y <output id="yO"></output></label><input id="y" type="range" min="0" max="100"></div></div>
<div class="two"><div class="field"><label>Rộng <output id="wO"></output></label><input id="width" type="range" min="24" max="240"></div><div class="field"><label>Cao <output id="hO"></output></label><input id="height" type="range" min="20" max="180"></div></div>
<div class="two"><div class="field"><label>Scale <output id="sO"></output></label><input id="scale" type="range" min="50" max="180"></div><div class="field"><label>Độ mờ <output id="oO"></output></label><input id="opacity" type="range" min="10" max="100"></div></div>
<div class="field"><label>Hình dạng</label><select id="shape"><option value="circle">Tròn</option><option value="rounded">Bo góc</option><option value="square">Vuông</option><option value="pill">Viên thuốc</option></select></div>
<div class="field"><label>Màu nền</label><input id="color" type="color"></div><label class="check"><input id="visible" type="checkbox"> Hiển thị</label></div>
<div class="actions"><button id="duplicate">Nhân đôi</button><button id="restore">Khôi phục</button><button id="import">Nhập JSON</button><button id="export">Xuất JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div><div class="status" id="status">Sẵn sàng.</div></section></div>
<script>
const KEY='afkHudLayoutV1', $=id=>document.getElementById(id);
const defs={
hpStat:{name:'Thanh HP',icon:'❤️ HP',x:13,y:8,width:92,height:32,scale:100,opacity:100,visible:true,shape:'rounded',color:'#17303b'},
mpStat:{name:'Thanh MP',icon:'💧 MP',x:29,y:8,width:92,height:32,scale:100,opacity:100,visible:true,shape:'rounded',color:'#17303b'},
joystick:{name:'Joystick',icon:'',x:9,y:81,width:72,height:72,scale:100,opacity:100,visible:true,shape:'circle',color:'#17303b'},
mobileAttack:{name:'Nút đánh',icon:'⚔️',x:91,y:81,width:64,height:64,scale:100,opacity:100,visible:true,shape:'circle',color:'#263f4c'},
autoBtn:{name:'AUTO',icon:'⚡',x:76,y:58,width:50,height:50,scale:100,opacity:100,visible:true,shape:'circle',color:'#245b42'},
skillBtn:{name:'Kỹ năng',icon:'✨',x:91,y:58,width:50,height:50,scale:100,opacity:100,visible:true,shape:'circle',color:'#263f4c'},
potionBtn:{name:'Bình HP',icon:'❤️',x:76,y:91,width:46,height:46,scale:100,opacity:100,visible:true,shape:'circle',color:'#263f4c'},
mpPotionBtn:{name:'Bình MP',icon:'💧',x:91,y:91,width:46,height:46,scale:100,opacity:100,visible:true,shape:'circle',color:'#263f4c'},
chatToggle:{name:'Chat',icon:'💬',x:96,y:10,width:52,height:52,scale:100,opacity:100,visible:true,shape:'circle',color:'#263f4c'},
mapBanner:{name:'Tên bản đồ',icon:'ABORNE',x:50,y:15,width:190,height:48,scale:100,opacity:100,visible:true,shape:'rounded',color:'#dfc080'},
menuBar:{name:'Thanh menu',icon:'👤 🗺️ 🎯 🎒 ⚙️',x:50,y:7,width:380,height:48,scale:100,opacity:100,visible:true,shape:'rounded',color:'#203541'}};
const exportedDefaults={"hpStat":{"x":34.47820385177246,"y":90.18787683363027,"width":240,"height":32,"scale":100,"opacity":100,"visible":true,"shape":"pill","color":"#17303b"},"mpStat":{"x":50.85865120908599,"y":90.0313157918155,"width":240,"height":32,"scale":100,"opacity":100,"visible":true,"shape":"pill","color":"#17303b"},"joystick":{"x":14.487010410243048,"y":72.49620437719923,"width":72,"height":72,"scale":180,"opacity":100,"visible":true,"shape":"circle","color":"#17303b"},"mobileAttack":{"x":87.93482676403623,"y":82.67282737810304,"width":64,"height":64,"scale":180,"opacity":100,"visible":true,"shape":"circle","color":"#263f4c"},"autoBtn":{"x":92.07396971597421,"y":63.102398530211104,"width":50,"height":50,"scale":150,"opacity":100,"visible":true,"shape":"circle","color":"#245b42"},"skillBtn":{"x":85.3808912126981,"y":66.23366714587381,"width":50,"height":50,"scale":150,"opacity":100,"visible":true,"shape":"circle","color":"#263f4c"},"potionBtn":{"x":77.71906440176343,"y":87.68286433006847,"width":46,"height":46,"scale":150,"opacity":100,"visible":true,"shape":"circle","color":"#263f4c"},"mpPotionBtn":{"x":79.48040297177506,"y":75.15778986741763,"width":46,"height":46,"scale":150,"opacity":100,"visible":true,"shape":"circle","color":"#263f4c"},"chatToggle":{"x":94.36371523216808,"y":10.497088176045946,"width":52,"height":52,"scale":130,"opacity":100,"visible":true,"shape":"circle","color":"#263f4c"},"mapBanner":{"x":49.889916339374274,"y":23.178729652932468,"width":190,"height":48,"scale":100,"opacity":100,"visible":false,"shape":"rounded","color":"#dfc080"},"menuBar":{"x":49.537647281577264,"y":5.956755252998021,"width":380,"height":48,"scale":115,"opacity":100,"visible":true,"shape":"pill","color":"#203541"}};
for(const [k,v] of Object.entries(exportedDefaults))Object.assign(defs[k],v);
let layout=structuredClone(defs),selected='mobileAttack',drag=null,undo=[],redo=[];
const phone=$('phone');
function say(t){$('status').textContent=t}
function snapshot(){undo.push(JSON.stringify(layout));if(undo.length>50)undo.shift();redo=[]}
function choose(k){selected=k;render()}
function draw(){ $('elements').innerHTML=Object.entries(layout).map(([k,v])=>'<div class="element '+(k===selected?'selected':'')+'" data-key="'+k+'" style="left:'+v.x+'%;top:'+v.y+'%;width:'+v.width+'px;height:'+v.height+'px;transform:translate(-50%,-50%) scale('+(v.scale/100)+');opacity:'+(v.opacity/100)+';border-radius:'+(v.shape==='circle'?'50%':v.shape==='pill'?'999px':v.shape==='square'?'0':'10px')+';background:'+v.color+';display:'+(v.visible?'flex':'none')+'">'+(k.endsWith('Stat')?'<span>'+v.icon+'</span><i class="bar"></i>':v.icon)+'</div>').join('');
 document.querySelectorAll('.element').forEach(el=>{el.onpointerdown=e=>{e.preventDefault();snapshot();selected=el.dataset.key;document.querySelectorAll('.element').forEach(n=>n.classList.toggle('selected',n.dataset.key===selected));fields();drag={key:el.dataset.key,id:e.pointerId};el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;const r=phone.getBoundingClientRect(),v=layout[drag.key];v.x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));v.y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));const n=document.querySelector('.element[data-key="'+drag.key+'"]');n.style.left=v.x+'%';n.style.top=v.y+'%';fields()};el.onpointerup=el.onpointercancel=()=>{if(drag){saveLayout();say('Đã tự lưu bố cục HUD. Mở lại game để áp dụng.')}drag=null}});
}
function palette(){$('palette').innerHTML=Object.entries(layout).map(([k,v])=>'<button class="part" data-k="'+k+'"><span class="ico">'+(v.icon||'◉')+'</span><span>'+v.name+'<small>'+k+'</small></span></button>').join('');document.querySelectorAll('.part').forEach(b=>b.onclick=()=>choose(b.dataset.k))}
function fields(){const v=layout[selected];$('selected').innerHTML=Object.entries(layout).map(([k,a])=>'<option value="'+k+'">'+a.name+'</option>').join('');$('selected').value=selected;for(const k of ['icon','x','y','width','height','scale','opacity','shape','color','visible'])$(k).type==='checkbox'?$(k).checked=v[k]:$(k).value=v[k];$('xO').textContent=Math.round(v.x)+'%';$('yO').textContent=Math.round(v.y)+'%';$('wO').textContent=v.width+'px';$('hO').textContent=v.height+'px';$('sO').textContent=v.scale+'%';$('oO').textContent=v.opacity+'%'}
function render(){draw();palette();fields()}
$('selected').onchange=e=>choose(e.target.value);
for(const k of ['icon','x','y','width','height','scale','opacity','shape','color','visible'])$(k).oninput=e=>{snapshot();layout[selected][k]=k==='visible'?e.target.checked:(['x','y','width','height','scale','opacity'].includes(k)?+e.target.value:e.target.value);draw();fields();saveLayout()};
$('reset').onclick=()=>{snapshot();layout=structuredClone(defs);selected='mobileAttack';render();say('Đã khôi phục mặc định.')};
$('restore').onclick=()=>{snapshot();layout[selected]={...defs[selected]};render();say('Đã khôi phục đối tượng.')};
$('duplicate').onclick=()=>{snapshot();const k=selected+'Copy';layout[k]={...layout[selected],name:layout[selected].name+' (bản sao)',x:Math.min(95,layout[selected].x+5),y:Math.min(95,layout[selected].y+5)};selected=k;render();say('Đã nhân đôi trong bản xem trước. Bản sao không xuất vào game.')};
$('undo').onclick=()=>{if(!undo.length)return;redo.push(JSON.stringify(layout));layout=JSON.parse(undo.pop());render()};
$('redo').onclick=()=>{if(!redo.length)return;undo.push(JSON.stringify(layout));layout=JSON.parse(redo.pop());render()};
function saveLayout(){try{localStorage.setItem(KEY,JSON.stringify(payload()))}catch(err){say('Không thể lưu HUD: '+err.message)}}
$('save').onclick=()=>{saveLayout();say('Đã lưu HUD. Mở lại game để áp dụng.')};
function payload(){const items={};for(const k of Object.keys(defs)){const v=layout[k];items[k]=Object.fromEntries(['x','y','width','height','scale','opacity','visible','shape','color'].map(p=>[p,v[p]]))}return {version:4,items}}
function exportJson(){const b=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='afk-adventure-hud.json';a.click();URL.revokeObjectURL(a.href);say('Đã xuất afk-adventure-hud.json')}
$('export').onclick=$('exportTop').onclick=exportJson;$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.version!==4||!d.items)throw Error('Không đúng cấu hình HUD v4');snapshot();for(const k of Object.keys(defs))if(d.items[k])layout[k]={...defs[k],...d.items[k]};render();saveLayout();say('Đã nhập và lưu cấu hình HUD.')}catch(err){say('Lỗi: '+err.message)}e.target.value=''};
$('back').onclick=()=>location.href='index.html';
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d?.version===4)for(const k of Object.keys(defs))if(d.items?.[k])layout[k]={...defs[k],...d.items[k]}}catch{}
render();
</script></body></html>
